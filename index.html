<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prime Stream</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-theme="dark">
    <header id="navbar" class="navbar">
      <div class="logo">Prime <span>Stream</span></div>

      <nav id="navTabs" class="nav-tabs">
        <button class="nav-tab active" data-view="home">Home</button>
        <button class="nav-tab" data-view="movies">Movies</button>
        <button class="nav-tab" data-view="trending">Trending</button>
        <button class="nav-tab" data-view="india">Popular in India</button>
        <button class="nav-tab" data-view="mylist">My List</button>
      </nav>

      <div class="nav-actions">
        <div class="search-wrap">
          <input
            id="searchInput"
            type="search"
            autocomplete="off"
            placeholder="Search movies..."
            aria-label="Search movies"
          />
          <div id="searchSuggestions" class="search-suggestions"></div>
        </div>
        <select id="languageToggle" class="compact-select" aria-label="Language">
          <option value="en">EN</option>
          <option value="hi">HI</option>
          <option value="es">ES</option>
        </select>
        <button id="themeToggle" class="icon-btn" aria-label="Toggle theme">🌙</button>
        <div class="profile-wrap">
          <button id="profileBtn" class="profile-btn" aria-label="Profile menu">
            <span class="avatar">👤</span>
            <span id="profileName">Guest</span>
          </button>
          <div id="profileMenu" class="profile-menu"></div>
        </div>
        <button id="mobileNavBtn" class="icon-btn mobile-nav-btn" aria-label="Open menu">☰</button>
      </div>
    </header>

    <main id="appRoot">
      <section id="view-home" class="view active">
        <section id="heroSection" class="hero">
          <div id="heroBackdrop" class="hero-backdrop"></div>
          <div class="hero-overlay"></div>
          <div class="hero-content">
            <span class="top-badge">Top 10 Today</span>
            <h1 id="heroTitle">Spider-Man</h1>
            <p id="heroMeta">⭐ 0.0/10</p>
            <p id="heroOverview">Loading Spider-Man showcase...</p>
            <div class="hero-actions">
              <button id="heroTrailerBtn" class="primary-btn">▶ Watch Trailer</button>
              <button id="heroWatchlistBtn" class="ghost-btn">✚ Add to Watchlist</button>
            </div>
          </div>
          <div id="heroTrailerWrap" class="hero-trailer-wrap"></div>
        </section>

        <section class="panel">
          <div id="homeRows" class="rows-container"></div>
        </section>
      </section>

      <section id="view-movies" class="view">
        <section class="movies-toolbar">
          <div id="genreChips" class="genre-chips"></div>
          <div class="sort-block">
            <label for="sortBy">Sort</label>
            <select id="sortBy" class="compact-select">
              <option value="popularity">Popularity</option>
              <option value="rating">Rating</option>
            </select>
          </div>
        </section>
        <section id="moviesGrid" class="movie-grid"></section>
      </section>

      <section id="view-trending" class="view">
        <section class="panel">
          <h2>Trending This Week</h2>
          <div id="trendingGrid" class="movie-grid"></div>
        </section>
      </section>

      <section id="view-india" class="view">
        <section class="panel">
          <h2>Popular in India</h2>
          <div id="indiaGrid" class="movie-grid"></div>
        </section>
      </section>

      <section id="view-mylist" class="view">
        <section class="panel">
          <h2>My List</h2>
          <div id="myListGrid" class="movie-grid"></div>
        </section>
      </section>
    </main>

    <button id="scrollTopBtn" class="scroll-top-btn" aria-label="Scroll to top">↑</button>

    <footer class="footer">
      <div class="footer-links">
        <a href="#">About</a>
        <a href="#">Contact</a>
        <a href="#">Privacy Policy</a>
      </div>
      <p>© <span id="yearText"></span> Prime Stream</p>
    </footer>

    <div id="toastStack" class="toast-stack"></div>

    <div id="trailerModal" class="modal">
      <div class="modal-card trailer-modal-card">
        <button class="close-btn" data-close-modal="trailerModal">✕</button>
        <iframe
          id="trailerFrame"
          title="Trailer player"
          src=""
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          allowfullscreen
        ></iframe>
      </div>
    </div>

    <div id="movieModal" class="modal">
      <div class="modal-card movie-modal-card">
        <button class="close-btn" data-close-modal="movieModal">✕</button>
        <div id="movieModalBody"></div>
      </div>
    </div>

    <div id="authModal" class="modal">
      <div class="modal-card auth-modal-card">
        <button class="close-btn" data-close-modal="authModal">✕</button>
        <h3 id="authTitle">Login</h3>
        <form id="authForm" novalidate>
          <div id="nameFieldWrap" class="field hidden">
            <label for="authName">Username</label>
            <input id="authName" type="text" />
          </div>
          <div class="field">
            <label for="authEmail">Email</label>
            <input id="authEmail" type="email" required />
          </div>
          <div class="field">
            <label for="authPassword">Password</label>
            <input id="authPassword" type="password" minlength="6" required />
          </div>
          <div id="confirmFieldWrap" class="field hidden">
            <label for="authConfirm">Confirm Password</label>
            <input id="authConfirm" type="password" />
          </div>
          <button id="authSubmitBtn" type="submit" class="primary-btn">Login</button>
          <button id="authSwitchBtn" type="button" class="link-btn">Create account</button>
        </form>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
