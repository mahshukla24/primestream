<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prime Stream</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-theme="dark">
    <header id="navbar" class="navbar">
      <div class="logo">Prime <span>Stream</span></div>

      <nav id="navTabs" class="nav-tabs">
        <button class="nav-tab active" data-view="home">Home</button>
        <button class="nav-tab" data-view="marvel">Marvel Universe</button>
        <button class="nav-tab" data-view="bollywood">Bollywood</button>
        <button class="nav-tab" data-view="hollywood">Hollywood</button>
        <button class="nav-tab" data-view="mylist">My List</button>
      </nav>

      <div class="nav-actions">
        <button id="quickPlayBtn" class="pill-btn">🎬 Quick Play</button>
        <button id="themeToggle" class="icon-btn" aria-label="Toggle theme">🌙</button>
        <div class="profile-wrap">
          <button id="profileBtn" class="profile-btn" aria-label="Profile menu">
            <span>👤</span>
            <span id="profileName">Guest</span>
          </button>
          <div id="profileMenu" class="profile-menu"></div>
        </div>
        <button id="mobileNavBtn" class="icon-btn mobile-nav-btn" aria-label="Menu">☰</button>
      </div>
    </header>

    <main>
      <section id="view-home" class="view active">
        <section class="hero">
          <div id="heroBackdrop" class="hero-backdrop"></div>
          <div class="hero-overlay"></div>
          <div class="hero-content">
            <span class="hero-badge">Top 10 Today</span>
            <h1 id="heroTitle">Spider-Man: Homecoming</h1>
            <p id="heroMeta">⭐ 7.4/10 • Marvel</p>
            <p id="heroDescription">
              Peter Parker balances high school life with superhero duties while facing the Vulture.
            </p>
            <div class="hero-actions">
              <button id="heroTrailerBtn" class="primary-btn">▶ Watch Trailer</button>
              <button id="heroWatchlistBtn" class="ghost-btn">✚ Add to Watchlist</button>
            </div>
          </div>
          <div id="heroTrailerWrap" class="hero-trailer-wrap"></div>
        </section>

        <section class="panel">
          <h3>Mood Picker</h3>
          <div id="moodPicker" class="mood-picker">
            <button class="mood-btn active" data-mood="all">All</button>
            <button class="mood-btn" data-mood="action">Action</button>
            <button class="mood-btn" data-mood="emotional">Emotional</button>
            <button class="mood-btn" data-mood="mind">Mind-blowing</button>
          </div>
        </section>

        <section class="panel">
          <div id="homeRows" class="rows-container"></div>
        </section>
      </section>

      <section id="view-marvel" class="view">
        <section class="panel">
          <h2>MCU Universe</h2>
          <div id="marvelGrid" class="movie-grid"></div>
        </section>
      </section>

      <section id="view-bollywood" class="view">
        <section class="panel">
          <h2>Bollywood Hits</h2>
          <div id="bollywoodGrid" class="movie-grid"></div>
        </section>
      </section>

      <section id="view-hollywood" class="view">
        <section class="panel">
          <h2>Hollywood Classics</h2>
          <div id="hollywoodGrid" class="movie-grid"></div>
        </section>
      </section>

      <section id="view-mylist" class="view">
        <section class="panel">
          <h2>My List</h2>
          <div id="myListGrid" class="movie-grid"></div>
        </section>
      </section>
    </main>

    <button id="scrollTopBtn" class="scroll-top-btn" aria-label="Scroll to top">↑</button>

    <footer class="footer">
      <div class="footer-links">
        <a href="#">About</a>
        <a href="#">Contact</a>
        <a href="#">Privacy Policy</a>
      </div>
      <p>© <span id="yearText"></span> Prime Stream</p>
    </footer>

    <div id="toastStack" class="toast-stack"></div>

    <div id="trailerModal" class="modal">
      <div class="modal-card trailer-modal-card">
        <button class="close-btn" data-close-modal="trailerModal">✕</button>
        <iframe
          id="trailerFrame"
          title="Trailer player"
          src=""
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          allowfullscreen
        ></iframe>
      </div>
    </div>

    <div id="movieModal" class="modal">
      <div class="modal-card movie-modal-card">
        <button class="close-btn" data-close-modal="movieModal">✕</button>
        <div id="movieModalBody"></div>
      </div>
    </div>

    <div id="authModal" class="modal">
      <div class="modal-card auth-modal-card">
        <button class="close-btn" data-close-modal="authModal">✕</button>
        <h3 id="authTitle">Login</h3>
        <form id="authForm" novalidate>
          <div id="nameFieldWrap" class="field hidden">
            <label for="authName">Username</label>
            <input id="authName" type="text" />
          </div>
          <div class="field">
            <label for="authEmail">Email</label>
            <input id="authEmail" type="email" required />
          </div>
          <div class="field">
            <label for="authPassword">Password</label>
            <input id="authPassword" type="password" minlength="6" required />
          </div>
          <div id="confirmFieldWrap" class="field hidden">
            <label for="authConfirm">Confirm Password</label>
            <input id="authConfirm" type="password" />
          </div>
          <button id="authSubmitBtn" type="submit" class="primary-btn">Login</button>
          <button id="authSwitchBtn" type="button" class="link-btn">Create account</button>
        </form>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
